<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="google-site-verification" content="vT7ApFj7ndzwZYRcgoUXNj70aU4HyVvhkpC6nCNdSNU" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>build a bibel</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #684832; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: #684832; color: #fff4e5; font-family: Arial, sans-serif; }
    header { padding: 32px 24px; text-align: center; border-bottom: 1px solid #ffffff26; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3rem); font-weight: 600; }
    main { flex: 1; width: 100%; max-width: 900px; margin: 0 auto; padding: 40px 24px; }
    [hidden] { display: none !important; }
    h2 { margin-top: 0; font-size: 1.8rem; }
    p { line-height: 1.6; }
    footer { padding: 24px; text-align: center; border-top: 1px solid #ffffff26; }
    a { color: inherit; text-underline-offset: 5px; }
    a:hover { color: #ffffff; }
    a:focus-visible { outline: 2px solid #fff4e5; outline-offset: 6px; }
  </style>
</head>
<body>
  <header><h1>build a bibel</h1></header>
  <main>
    <section id="startseite" aria-label="Startseite"></section>
    <section id="impressum" aria-labelledby="impressum-titel" hidden>
      <h2 id="impressum-titel" tabindex="-1">Impressum</h2>
      <p>Tim Brungardt<br>Erlenbachstraße 56/1<br>89155 Erbach</p>
      <p>E-Mail: <a href="mailto:buildyourbible.game@gmail.com">buildyourbible.game@gmail.com</a></p>
      <p><a href="#startseite">Zurück zur Startseite</a></p>
    </section>
  </main>
  <footer><a href="#impressum">Impressum</a></footer>
  <script>
    function zeigeSeite(fokus) {
      const istImpressum = window.location.hash === '#impressum';
      document.getElementById('startseite').hidden = istImpressum;
      document.getElementById('impressum').hidden = !istImpressum;
      document.title = istImpressum ? 'Impressum – build a bibel' : 'build a bibel';
      if (fokus) {
        window.scrollTo(0, 0);
        (istImpressum ? document.getElementById('impressum-titel') : document.querySelector('h1')).focus();
      }
    }
    document.querySelector('h1').tabIndex = -1;
    window.addEventListener('hashchange', () => zeigeSeite(true));
    zeigeSeite(false);
  </script>
</body>
</html>
